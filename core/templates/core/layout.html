{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css"
                integrity="sha384-NvKbDTEnL+A8F/AA5Tc5kmMLSJHUO868P+lDtTpJIeQdGYaUIuLr4lVGOEA1OcMy" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'core/css/core.css' %}">
    <script src="{% static 'core/js/core.js' %}" defer></script>
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <aside>
        <span id="logo">
            <img id="icon-logo" src="{% static 'core/img/note.svg' %}">
            <h1>ToDoList</h1>
        </span>
        <h4>Навигация</h4>
        <ul>
            <li><i class="bi bi-house-door-fill h4 icons"></i><a href="/">Главная</a></li>
            <li><i class="bi bi-bookmark-fill h4 icons"></i><a href="about">О сайте</a></li>
        </ul>
    </aside>
    <main>
        {% block body %}
        {% endblock %}
    </main>
</body>
</html>
